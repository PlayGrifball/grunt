suite: halo-gateway
release:
  name: halo-gateway
  namespace: halo-gateway
values:
  - ../ci/full-values.yaml
tests:
  - it: runs one replica with Recreate, non-root, read-only root filesystem and CPU limits
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: "spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem"
          value: true
      - isNotEmpty:
          path: "spec.template.spec.containers[0].resources.limits.cpu"
      - equal:
          path: "spec.template.spec.containers[0].image"
          value: "ghcr.io/playgrifball/halo-gateway:sha-0000000"

  - it: probes liveness without checks and readiness with the Halo account check
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: "spec.template.spec.containers[0].livenessProbe.httpGet.path"
          value: /health/live
      - equal:
          path: "spec.template.spec.containers[0].startupProbe.httpGet.path"
          value: /health/live
      - equal:
          path: "spec.template.spec.containers[0].readinessProbe.httpGet.path"
          value: /health/ready

  - it: wires consumer keys from secrets or hashes, with priority 0 kept
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Gateway__ApiKeys__0__Priority
            value: "0"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Gateway__ApiKeys__0__Key
            valueFrom: { secretKeyRef: { name: halo-gateway-keys, key: grif-prod } }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Gateway__ApiKeys__1__Key
            valueFrom: { secretKeyRef: { name: halo-gateway-keys, key: grif-test } }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Gateway__ApiKeys__2__KeySha256
            value: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Gateway__AdminKey
            valueFrom: { secretKeyRef: { name: halo-gateway-admin, key: AdminKey } }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Serilog__MinimumLevel__Override__Surprenant.Grunt
            value: Debug

  - it: trusts the pod network for forwarded headers by default
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ForwardedHeaders__KnownIPNetworks__0
            value: "10.42.0.0/16"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ForwardedHeaders__ForwardedForHeaderName
            value: X-Real-IP

  - it: sets OTEL variables when telemetry is on
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://otel-collector.monitoring:4317"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_SERVICE_NAME
            value: halo-gateway

  - it: fails without a key source
    template: templates/deployment.yaml
    set:
      apiKeys:
        - name: broken
    asserts:
      - failedTemplate:
          errorMessage: apiKeys[0] (broken) needs secretName or keySha256

  - it: fails without a redirect URL
    template: templates/deployment.yaml
    set:
      oauth.redirectUrl: ""
    asserts:
      - failedTemplate: {}

  - it: keeps the token claim on uninstall and when Argo CD prunes
    template: templates/pvc.yaml
    asserts:
      - equal:
          path: 'metadata.annotations["helm.sh/resource-policy"]'
          value: keep
      - equal:
          path: 'metadata.annotations["argocd.argoproj.io/sync-options"]'
          value: "Prune=false,Delete=false"

  - it: mounts an emptyDir and no claim without persistence
    templates: [templates/deployment.yaml, templates/pvc.yaml]
    set:
      persistence.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/pvc.yaml
      - isNotNull:
          path: "spec.template.spec.volumes[0].emptyDir"
        template: templates/deployment.yaml

  - it: routes only the OAuth callback publicly by default, rate limit first
    template: templates/ingressroute.yaml
    asserts:
      - equal:
          path: metadata.name
          value: halo-gateway-oauth-callback
      - equal:
          path: spec.routes[0].match
          value: Host(`halo-gateway.example.com`) && Path(`/oauth/callback`)
      - lengthEqual:
          path: spec.routes
          count: 1
      - equal:
          path: spec.routes[0].middlewares
          value: [{ name: halo-gateway-ratelimit }]

  - it: in all mode, routes the admin page and everything else separately, never health
    template: templates/ingressroute.yaml
    set:
      ingressRoute.mode: all
      ingressRoute.rateLimitMiddleware: { name: rl, namespace: traefik }
      ingressRoute.middlewares: [{ name: security-headers, namespace: traefik }]
      ingressRoute.admin.middlewares: [{ name: authentik-forwardauth, namespace: authentik }, { name: security-headers, namespace: traefik }]
    asserts:
      - equal:
          path: metadata.name
          value: halo-gateway
      - lengthEqual:
          path: spec.routes
          count: 2
      - equal:
          path: spec.routes[0].match
          value: Host(`halo-gateway.example.com`) && PathRegexp(`(?i)^/+admin(/|$)`)
      - equal:
          path: spec.routes[0].middlewares
          value: [{ name: rl, namespace: traefik }, { name: authentik-forwardauth, namespace: authentik }, { name: security-headers, namespace: traefik }]
      - equal:
          path: spec.routes[1].match
          value: Host(`halo-gateway.example.com`) && !PathRegexp(`(?i)^/+(health|admin)(/|$)`)
      - equal:
          path: spec.routes[1].middlewares
          value: [{ name: rl, namespace: traefik }, { name: security-headers, namespace: traefik }]
      - equal:
          path: spec.routes[1].services[0]
          value: { name: halo-gateway, port: 8080 }

  - it: in all mode without middlewares renders none
    template: templates/ingressroute.yaml
    set:
      ingressRoute.mode: all
      ingressRoute.rateLimitMiddleware.name: ""
    asserts:
      - notExists:
          path: spec.routes[0].middlewares
      - notExists:
          path: spec.routes[1].middlewares

  - it: rejects an unknown mode
    template: templates/ingressroute.yaml
    set:
      ingressRoute.mode: admin
    asserts:
      - failedTemplate:
          errorMessage: ingressRoute.mode must be callback or all (got admin)

  - it: lets only the listed consumer namespaces and the ingress controller in (nothing scrapes it)
    template: templates/networkpolicy.yaml
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 2
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchExpressions[0].values
          value: [grif-prod, grif-test, grif-preview1]
      - equal:
          path: spec.ingress[1].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: traefik
      - equal:
          path: "spec.egress[1].ports[0].port"
          value: 443
      - equal:
          path: "spec.egress[2].ports[0].port"
          value: 4317

  - it: allows egress to the OIDC provider when listed
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.oidcTo: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: authentik } } }]
    asserts:
      - equal:
          path: "spec.egress[3].to[0].namespaceSelector.matchLabels[\"kubernetes.io/metadata.name\"]"
          value: authentik
      - equal:
          path: "spec.egress[3].ports[0].port"
          value: 443

  - it: wires OIDC from values and the secret
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Gateway__Oidc__Authority
            value: https://auth.example.com/application/o/halo-gateway/
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Gateway__Oidc__ClientId
            value: halo-gateway
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Gateway__Oidc__ClientSecret
            valueFrom:
              secretKeyRef:
                name: halo-gateway-oidc
                key: ClientSecret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Gateway__Oidc__AllowedGroups__0
            value: admins

  - it: OIDC needs allowed groups
    template: templates/deployment.yaml
    set:
      oidc.allowedGroups: []
    asserts:
      - failedTemplate:
          errorMessage: oidc.allowedGroups is required when oidc.enabled (nobody could sign in)

  - it: alerts on the pushed metrics, selected by namespace and job
    template: templates/prometheusrule.yaml
    asserts:
      - lengthEqual:
          path: "spec.groups[0].rules"
          count: 5
      - equal:
          path: spec.groups[0].rules[0].expr
          value: max(grunt_gateway_halo_reauth_required{k8s_namespace_name="halo-gateway", job=~"(.+/)?halo-gateway"}) == 1
      - equal:
          path: spec.groups[0].rules[4].alert
          value: HaloGatewayMetricsAbsent
      - equal:
          path: spec.groups[0].rules[4].expr
          value: absent(grunt_gateway_halo_reauth_required{k8s_namespace_name="halo-gateway", job=~"(.+/)?halo-gateway"})
      - equal:
          path: spec.groups[0].rules[4].for
          value: 10m

  - it: takes a custom selector for other pipelines
    template: templates/prometheusrule.yaml
    set:
      prometheusRule.selector: service_name="halo-gateway"
    asserts:
      - equal:
          path: spec.groups[0].rules[0].expr
          value: max(grunt_gateway_halo_reauth_required{service_name="halo-gateway"}) == 1

  - it: alerts need telemetry
    template: templates/prometheusrule.yaml
    set:
      telemetry.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "prometheusRule needs telemetry.enabled: the gateway's metrics reach Prometheus only by OTLP push"
