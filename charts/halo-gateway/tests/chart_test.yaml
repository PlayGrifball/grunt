suite: halo-gateway
release:
  name: halo-gateway
  namespace: halo-gateway
values:
  - ../ci/full-values.yaml
tests:
  - it: runs one replica with Recreate, non-root, read-only root filesystem and CPU limits
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: "spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem"
          value: true
      - isNotEmpty:
          path: "spec.template.spec.containers[0].resources.limits.cpu"
      - equal:
          path: "spec.template.spec.containers[0].image"
          value: "ghcr.io/playgrifball/halo-gateway:sha-0000000"

  - it: probes liveness without checks and readiness with the Halo account check
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: "spec.template.spec.containers[0].livenessProbe.httpGet.path"
          value: /health/live
      - equal:
          path: "spec.template.spec.containers[0].startupProbe.httpGet.path"
          value: /health/live
      - equal:
          path: "spec.template.spec.containers[0].readinessProbe.httpGet.path"
          value: /health/ready

  - it: wires consumer keys from secrets or hashes, with no per-key quota or priority (first come, first served)
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: Gateway__ApiKeys__0__PermitsPerMinute }
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: Gateway__GlobalQuota__PermitsPerMinute }
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Gateway__ApiKeys__0__Key
            valueFrom: { secretKeyRef: { name: halo-gateway-keys, key: grif-prod } }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Gateway__ApiKeys__1__Key
            valueFrom: { secretKeyRef: { name: halo-gateway-keys, key: grif-test } }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Gateway__ApiKeys__2__KeySha256
            value: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Gateway__AdminKey
            valueFrom: { secretKeyRef: { name: halo-gateway-admin, key: AdminKey } }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Serilog__MinimumLevel__Override__Surprenant.Grunt
            value: Debug

  - it: trusts the pod network for forwarded headers by default
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ForwardedHeaders__KnownIPNetworks__0
            value: "10.42.0.0/16"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ForwardedHeaders__ForwardedForHeaderName
            value: X-Real-IP

  - it: sets OTEL variables when telemetry is on
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://otel-collector.monitoring:4317"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_SERVICE_NAME
            value: halo-gateway

  - it: fails without a key source
    template: templates/deployment.yaml
    set:
      apiKeys:
        - name: broken
    asserts:
      - failedTemplate:
          errorMessage: apiKeys[0] (broken) needs secretName or keySha256

  - it: fails without a redirect URL
    template: templates/deployment.yaml
    set:
      oauth.redirectUrl: ""
    asserts:
      - failedTemplate: {}

  - it: keeps the token claim on uninstall and when Argo CD prunes
    template: templates/pvc.yaml
    asserts:
      - equal:
          path: 'metadata.annotations["helm.sh/resource-policy"]'
          value: keep
      - equal:
          path: 'metadata.annotations["argocd.argoproj.io/sync-options"]'
          value: "Prune=false,Delete=false"

  - it: mounts an emptyDir and no claim without persistence
    templates: [templates/deployment.yaml, templates/pvc.yaml]
    set:
      persistence.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/pvc.yaml
      - isNotNull:
          path: "spec.template.spec.volumes[0].emptyDir"
        template: templates/deployment.yaml

  - it: routes the admin page and everything else separately, never health, with the OIDC callbacks carved out of admin
    template: templates/ingressroute.yaml
    asserts:
      - equal:
          path: metadata.name
          value: halo-gateway
      - lengthEqual:
          path: spec.routes
          count: 2
      - equal:
          path: spec.routes[0].match
          value: Host(`halo-gateway.example.com`) && PathRegexp(`(?i)^/+admin(/|$)`) && !PathRegexp(`(?i)^/+admin/+(signin-oidc|signout-callback-oidc)/*$`)
      - equal:
          path: spec.routes[0].middlewares
          value: [{ name: forward-auth, namespace: auth }]
      - equal:
          path: spec.routes[1].match
          value: Host(`halo-gateway.example.com`) && (!PathRegexp(`(?i)^/+(health|admin)(/|$)`) || PathRegexp(`(?i)^/+admin/+(signin-oidc|signout-callback-oidc)/*$`))
      - equal:
          path: spec.routes[1].middlewares
          value: [{ name: halo-gateway-ratelimit }]
      - equal:
          path: spec.routes[1].services[0]
          value: { name: halo-gateway, port: 8080 }

  - it: keeps the OIDC callback paths off the admin route's match (forward-auth never sees them) and on the public one
    template: templates/ingressroute.yaml
    asserts:
      - matchRegex:
          path: spec.routes[0].match
          pattern: '&& !PathRegexp\(`\(\?i\)\^/\+admin/\+\(signin-oidc\|signout-callback-oidc\)/\*\$`\)$'
      - matchRegex:
          path: spec.routes[1].match
          pattern: '\|\| PathRegexp\(`\(\?i\)\^/\+admin/\+\(signin-oidc\|signout-callback-oidc\)/\*\$`\)\)$'

  - it: renders no middlewares when none are set
    template: templates/ingressroute.yaml
    set:
      ingressRoute.middlewares: []
      ingressRoute.admin.middlewares: []
    asserts:
      - notExists:
          path: spec.routes[0].middlewares
      - notExists:
          path: spec.routes[1].middlewares

  - it: needs a host
    template: templates/ingressroute.yaml
    set:
      ingressRoute.host: ""
    asserts:
      - failedTemplate:
          errorMessage: ingressRoute.host is required when ingressRoute.enabled

  - it: lets only the listed consumer namespaces and the ingress controller in (nothing scrapes it)
    template: templates/networkpolicy.yaml
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 2
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchExpressions[0].values
          value: [grif-prod, grif-test, grif-preview1]
      - equal:
          path: spec.ingress[1].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: traefik
      - equal:
          path: "spec.egress[1].ports[0].port"
          value: 443
      - equal:
          path: "spec.egress[2].ports[0].port"
          value: 4317

  - it: allows egress to the OIDC provider when listed
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.oidcTo: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: authentik } } }]
    asserts:
      - equal:
          path: "spec.egress[3].to[0].namespaceSelector.matchLabels[\"kubernetes.io/metadata.name\"]"
          value: authentik
      - equal:
          path: "spec.egress[3].ports[0].port"
          value: 443

  - it: wires OIDC from values and the secret
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Gateway__Oidc__Authority
            value: https://auth.example.com/application/o/halo-gateway/
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Gateway__Oidc__ClientId
            value: halo-gateway
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Gateway__Oidc__ClientSecret
            valueFrom:
              secretKeyRef:
                name: halo-gateway-oidc
                key: ClientSecret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Gateway__Oidc__AllowedGroups__0
            value: admins

  - it: OIDC needs allowed groups
    template: templates/deployment.yaml
    set:
      oidc.allowedGroups: []
    asserts:
      - failedTemplate:
          errorMessage: oidc.allowedGroups is required when oidc.enabled (nobody could sign in)

  - it: alerts on the pushed metrics, selected by namespace and job
    template: templates/prometheusrule.yaml
    asserts:
      - lengthEqual:
          path: "spec.groups[0].rules"
          count: 4
      - equal:
          path: spec.groups[0].rules[0].expr
          value: max(grunt_gateway_halo_reauth_required{k8s_namespace_name="halo-gateway", job=~"(.+/)?halo-gateway"}) == 1
      - equal:
          path: spec.groups[0].rules[2].expr
          value: sum(rate(grunt_halo_requests_total{k8s_namespace_name="halo-gateway", job=~"(.+/)?halo-gateway",status="429"}[10m]) or vector(0)) > 0.05
      - equal:
          path: spec.groups[0].rules[3].alert
          value: HaloGatewayMetricsAbsent
      - equal:
          path: spec.groups[0].rules[3].expr
          value: absent(grunt_gateway_halo_reauth_required{k8s_namespace_name="halo-gateway", job=~"(.+/)?halo-gateway"})
      - equal:
          path: spec.groups[0].rules[3].for
          value: 10m

  - it: takes a custom selector for other pipelines
    template: templates/prometheusrule.yaml
    set:
      prometheusRule.selector: service_name="halo-gateway"
    asserts:
      - equal:
          path: spec.groups[0].rules[0].expr
          value: max(grunt_gateway_halo_reauth_required{service_name="halo-gateway"}) == 1

  - it: alerts need telemetry
    template: templates/prometheusrule.yaml
    set:
      telemetry.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "prometheusRule needs telemetry.enabled: the gateway's metrics reach Prometheus only by OTLP push"

  - it: passes each budget on (ClientConfiguration:Budgets), its operations by index; none by default (the image's)
    template: templates/deployment.yaml
    set:
      budgets:
        profile: { operations: [UserByGamertag, Users], limit: 10, window: "00:01:00", lockout: "00:05:00", maxWait: "00:00:00" }
        matchHistory: { limit: 0 }
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].env"
          content: { name: ClientConfiguration__Budgets__profile__Operations__0, value: UserByGamertag }
      - contains:
          path: "spec.template.spec.containers[0].env"
          content: { name: ClientConfiguration__Budgets__profile__Operations__1, value: Users }
      - contains:
          path: "spec.template.spec.containers[0].env"
          content: { name: ClientConfiguration__Budgets__profile__Limit, value: "10" }
      - contains:
          path: "spec.template.spec.containers[0].env"
          content: { name: ClientConfiguration__Budgets__profile__Lockout, value: "00:05:00" }
      - contains:
          path: "spec.template.spec.containers[0].env"
          content: { name: ClientConfiguration__Budgets__profile__MaxWait, value: "00:00:00" }
      - contains:
          path: "spec.template.spec.containers[0].env"
          content: { name: ClientConfiguration__Budgets__matchHistory__Limit, value: "0" }
      - notContains:
          path: "spec.template.spec.containers[0].env"
          content: { name: ClientConfiguration__Budgets__matchHistory__Window }
          any: true

  - it: sets no budget variables by default
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: "spec.template.spec.containers[0].env"
          content: { name: ClientConfiguration__Budgets__profile__Limit }
          any: true

  - it: renders no dashboard by default
    template: templates/grafana-dashboard.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the dashboard for Grafana's sidecar, in its namespace, with the gateway's series selector
    template: templates/grafana-dashboard.yaml
    set:
      grafanaDashboard: { enabled: true, namespace: monitoring, annotations: { grafana_folder: Halo } }
    asserts:
      - equal:
          path: metadata.namespace
          value: monitoring
      - equal:
          path: metadata.labels.grafana_dashboard
          value: "1"
      - equal:
          path: metadata.annotations.grafana_folder
          value: Halo
      - matchRegex:
          path: data["halo-gateway.json"]
          pattern: '"query": "k8s_namespace_name=\\"halo-gateway\\", job=~\\"\(\.\+/\)\?halo-gateway\\""'
      - notMatchRegex:
          path: data["halo-gateway.json"]
          pattern: __SELECTOR__

  - it: puts the dashboard in the release namespace without one, and uses a custom selector
    template: templates/grafana-dashboard.yaml
    set:
      grafanaDashboard.enabled: true
      prometheusRule.selector: service_name="halo-gateway"
    asserts:
      - equal:
          path: metadata.namespace
          value: halo-gateway
      - matchRegex:
          path: data["halo-gateway.json"]
          pattern: '"query": "service_name=\\"halo-gateway\\""'

  - it: the dashboard needs telemetry
    template: templates/grafana-dashboard.yaml
    set:
      grafanaDashboard.enabled: true
      telemetry.enabled: false
      prometheusRule.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "grafanaDashboard needs telemetry.enabled: the gateway's metrics reach Prometheus only by OTLP push"
