{{- $p := .Values.prometheusRule -}}
{{- if $p.enabled }}
{{- if not .Values.telemetry.enabled }}{{ fail "prometheusRule needs telemetry.enabled: the gateway's metrics reach Prometheus only by OTLP push" }}{{ end }}
{{- /*
The gateway serves no /metrics: its metrics are pushed over OTLP to a collector, which hands them to Prometheus (its prometheus
exporter, or remote write). With resource attributes promoted to labels, every pushed series carries k8s_namespace_name (the chart
sets k8s.namespace.name) and job = "[<service.namespace>/]<service.name>". The `namespace` label, if any, is the collector's.
*/}}
{{- $svc := .Values.telemetry.serviceName | default .Release.Name }}
{{- $sel := $p.selector | default (printf "k8s_namespace_name=%q, job=~%q" .Release.Namespace (printf "(.+/)?%s" (regexQuoteMeta $svc))) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "halo-gateway.fullname" . }}
  labels:
    {{- include "halo-gateway.labels" . | nindent 4 }}
    {{- with $p.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: halo-gateway
      rules:
        - alert: HaloGatewayReauthRequired
          expr: max(grunt_gateway_halo_reauth_required{ {{- $sel -}} }) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: The Halo gateway's account must be signed in again
            description: >-
              The refresh token was rejected or no token is stored in {{ .Release.Namespace }}. Sign in again from the admin page
              (/admin) or with GET /admin/halo/signin (admin key); /admin or GET /admin/halo/status shows the reason.
        - alert: HaloGatewayUpstreamErrors
          expr: |
            (
              sum(rate(grunt_gateway_upstream_responses_total{ {{- $sel -}} ,status=~"5..|0"}[10m]) or vector(0))
              + sum(rate(grunt_gateway_upstream_failures_total{ {{- $sel -}} }[10m]) or vector(0))
            )
            /
            clamp_min(
              sum(rate(grunt_gateway_upstream_responses_total{ {{- $sel -}} }[10m]) or vector(0))
              + sum(rate(grunt_gateway_upstream_failures_total{ {{- $sel -}} }[10m]) or vector(0)),
              1e-9
            ) > {{ $p.upstreamErrorRatio }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Halo calls through the gateway keep failing
            description: More than {{ mulf $p.upstreamErrorRatio 100 }}% of Halo calls failed (5xx or no response) after retries for 15 minutes.
        - alert: HaloGatewayUpstreamThrottled
          expr: sum(rate(grunt_halo_retries_total{ {{- $sel -}} ,status="429"}[10m]) or vector(0)) > {{ $p.upstreamThrottleRate }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Halo keeps rate-limiting the gateway
            description: The gateway retried Halo 429s at more than {{ $p.upstreamThrottleRate }}/s for 15 minutes; lower quotas or raise cache TTLs.
        - alert: HaloGatewayQuotaExhausted
          expr: sum by (key, reason) (rate(grunt_gateway_quota_rejections_total{ {{- $sel -}} }[10m])) > 0
          for: 10m
          labels:
            severity: info
          annotations:
            summary: "Gateway quota rejecting {{ "{{" }} $labels.key {{ "}}" }} ({{ "{{" }} $labels.reason {{ "}}" }})"
            description: A consumer key has been hitting its quota (or the global budget) for 10 minutes.
        # No `up` series for pushed metrics: the gauge below is reported on every export while the gateway runs, so its absence
        # means the gateway is down, or its pushes stopped reaching Prometheus.
        - alert: HaloGatewayMetricsAbsent
          expr: absent(grunt_gateway_halo_reauth_required{ {{- $sel -}} })
          for: {{ $p.absentFor }}
          labels:
            severity: warning
          annotations:
            summary: No metrics from the Halo gateway
            description: >-
              The gateway in {{ .Release.Namespace }} has pushed no metrics for {{ $p.absentFor }}: it is down, or its OTLP export
              (telemetry.endpoint, the NetworkPolicy's telemetry egress, the collector) is broken.
{{- end }}
