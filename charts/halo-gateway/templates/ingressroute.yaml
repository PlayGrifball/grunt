{{- $r := .Values.ingressRoute -}}
{{- if $r.enabled }}
{{- if not $r.host }}{{ fail "ingressRoute.host is required when ingressRoute.enabled" }}{{ end }}
# Only the OAuth callback is public: the browser that signs the Halo account in must reach the redirect URI.
# The callback redeems codes only for a state the admin API issued. The consumer API, /admin and /metrics are not routed.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "halo-gateway.fullname" . }}-oauth-callback
  labels:
    {{- include "halo-gateway.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml $r.entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: Host(`{{ $r.host }}`) && Path(`{{ $r.path }}`)
      {{- with $r.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ include "halo-gateway.fullname" . }}
          port: {{ .Values.service.port }}
  {{- if or $r.tls.secretName $r.tls.certResolver }}
  tls:
    {{- with $r.tls.secretName }}
    secretName: {{ . }}
    {{- end }}
    {{- with $r.tls.certResolver }}
    certResolver: {{ . }}
    {{- end }}
  {{- end }}
{{- end }}
