name: Gateway image

# Builds the Halo gateway host image (Grunt/Grunt.Gateway.Host/Dockerfile). Every run smoke-tests amd64 and arm64
# (arm64 under QEMU): the container starts read-only as non-root and answers /health/live. Only main pushes,
# multi-arch, to ghcr.io/playgrifball/halo-gateway (public repository, so a public image), tagged sha-<commit>, main
# and latest, and signs it keyless with cosign; the signature is verified before the run ends.

on:
  push:
    branches: [main]
    paths: ["Grunt/**", ".dockerignore", ".github/workflows/gateway-image.yml"]
  pull_request:
    paths: ["Grunt/**", ".dockerignore", ".github/workflows/gateway-image.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/playgrifball/halo-gateway
  DOCKERFILE: Grunt/Grunt.Gateway.Host/Dockerfile
  # On pull_request, tag sha- with the PR head commit rather than GitHub's merge commit.
  DOCKER_METADATA_PR_HEAD_SHA: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    name: smoke (${{ matrix.platform }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The .NET build runs natively (BUILDPLATFORM) and targets arm64; only running the arm64 image needs emulation.
      - name: Set up QEMU
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: halo-gateway:smoke
          cache-from: type=gha,scope=gateway-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          cache-to: type=gha,mode=max,scope=gateway-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}

      - name: Run it read-only and probe /health/live
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          docker run -d --name gw --platform "$PLATFORM" --read-only --tmpfs /tmp -p 18080:8080 \
            -e Gateway__AdminKey=smoke -e ClientConfiguration__RedirectUrl=https://example.invalid/oauth/callback \
            halo-gateway:smoke
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:18080/health/live; then echo; ok=1; break; fi
            sleep 2
          done
          docker logs gw | tail -n 40
          docker inspect gw --format 'user={{.Config.User}} arch={{.Architecture}}' || true
          test "${ok:-0}" = 1 || { echo "::error::The $PLATFORM image did not answer /health/live"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/halo/v1/medals)" = 401
          docker rm -f gw

  publish:
    needs: smoke
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Keyless signing (sigstore/fulcio identity challenge).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.4'

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=gateway-amd64
            type=gha,scope=gateway-arm64

      - name: Sign the image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      # What a cluster policy (e.g. Kyverno verifyImages) should check: keyless, from this workflow on main.
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "https://github.com/PlayGrifball/grunt/.github/workflows/gateway-image.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          {
            echo "Published and signed ${IMAGE}@${DIGEST}"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
