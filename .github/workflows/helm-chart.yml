name: Helm chart

# charts/halo-gateway: lint, helm-unittest, kubeconform (oldest/newest Kubernetes), an end-to-end install on k3d
# (charts/halo-gateway/e2e/run.sh, NetworkPolicies enforced) with the image built from this checkout, and, on main,
# publishing the chart signed (cosign keyless) to oci://ghcr.io/playgrifball/charts as halo-gateway:<x.y>.<run number>
# whenever the chart or the gateway changed since the last release, with the gateway image it runs baked in by digest:
# gateway-image.yml's signed sha-<this commit> when this push changed the gateway (waiting for it), else its signed main
# image. So one chart version is one release of everything grunt deploys. Then a GitHub release for that version,
# tagged halo-gateway-<version> (the <chart>-<version> tag Renovate matches to show release notes on chart bumps),
# listing the chart's and the gateway's commits since the previous one, the image and the chart
# (.github/scripts/chart-release-notes.mjs), followed by one atomic deployment commit at deploy/current: the chart from
# this source commit plus a values file pinning that release's image digest. The homelab follows that moving ref.

on:
  pull_request:
    paths: ["charts/**", "Grunt/**", ".config/dotnet-tools.json", ".dockerignore", ".github/workflows/gateway-image.yml", ".github/workflows/helm-chart.yml", ".github/workflows/publish.yml", ".github/scripts/chart-release-notes*", ".github/scripts/gateway-deploy*", ".github/scripts/package-publish*", ".github/scripts/generate-gateway-openapi.ps1"]
  push:
    branches: [main]
    paths: ["charts/**", "Grunt/**", ".config/dotnet-tools.json", ".dockerignore", ".github/workflows/gateway-image.yml", ".github/workflows/helm-chart.yml", ".github/workflows/publish.yml", ".github/scripts/chart-release-notes*", ".github/scripts/gateway-deploy*", ".github/scripts/package-publish*", ".github/scripts/generate-gateway-openapi.ps1"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-chart-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CHART: charts/halo-gateway
  REGISTRY: ghcr.io
  CHART_REPO: oci://ghcr.io/playgrifball/charts
  IMAGE: ghcr.io/playgrifball/halo-gateway
  # gateway-image.yml's keyless signature on main, which the image the chart runs must carry
  IMAGE_IDENTITY: ^https://github\.com/PlayGrifball/grunt/\.github/workflows/gateway-image\.yml@refs/heads/main$
  KUBERNETES_OLDEST: "1.30.0"
  KUBERNETES_NEWEST: "1.34.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Grunt/Grunt.Gateway.TypeScript/package-lock.json

      - name: Gateway contract and client packages
        shell: pwsh
        run: |
          # pwsh only fails the step on the last command's exit code; stop at the first failing native command instead.
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore Grunt/Grunt.slnx
          ./.github/scripts/generate-gateway-openapi.ps1
          Set-Location Grunt/Grunt.Gateway.TypeScript
          npm ci
          npm run check
          Set-Location ../..
          git diff --exit-code -- Grunt/Grunt.Gateway.TypeScript/openapi.json Grunt/Grunt.Gateway.TypeScript/src/generated
          # After the package is built, so TypeScriptClientEndToEndTests runs the TypeScript client against the host.
          $env:GRUNT_TYPESCRIPT_E2E = '1'
          dotnet test Grunt/Grunt.slnx --configuration Release

      - name: Lint
        run: |
          set -euo pipefail
          for values in "$CHART"/ci/*-values.yaml; do
            echo "::group::helm lint -f $values"
            helm lint "$CHART" --strict -f "$values"
            echo "::endgroup::"
          done

      - name: Unit tests
        run: |
          set -euo pipefail
          if helm version --short | grep -q '^v3'; then verify=; else verify=--verify=false; fi
          helm plugin install https://github.com/helm-unittest/helm-unittest $verify
          helm unittest "$CHART"

      # The Grafana dashboard offline: generated JSON, placeholders, datasources, the metrics the gateway defines, PromQL
      # syntax, histogram buckets; the alerts: promtool test rules (tests/alerts.promtool.yml) on the PrometheusRule as the
      # chart renders it; what helm package ships; dashboard-stack.sh with docker stubbed
      - name: Dashboard and alert tests
        run: |
          set -euo pipefail
          # promtool from the Prometheus release, checked against its sha256sums.txt entry before it runs
          curl --proto =https -fsSLO https://github.com/prometheus/prometheus/releases/download/v3.15.1/prometheus-3.15.1.linux-amd64.tar.gz
          echo "6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84  prometheus-3.15.1.linux-amd64.tar.gz" | sha256sum -c -
          tar xzf prometheus-3.15.1.linux-amd64.tar.gz
          PROMTOOL="$PWD/prometheus-3.15.1.linux-amd64/promtool" node --test "$CHART"/tests/*.test.mjs

      - name: Release and deployment tests
        run: node --test .github/scripts/chart-release-notes.test.mjs .github/scripts/gateway-deploy.test.mjs .github/scripts/package-publish.test.mjs

      - name: Schema check
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for k8s in "$KUBERNETES_OLDEST" "$KUBERNETES_NEWEST"; do
            for values in "$CHART"/ci/*-values.yaml; do
              echo "::group::$values, Kubernetes $k8s"
              helm template ci "$CHART" -n halo-gateway -f "$values" --kube-version "$k8s" \
                | ./kubeconform -strict -summary -kubernetes-version "$k8s" \
                    -schema-location default \
                    -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
              echo "::endgroup::"
            done
          done

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Gateway image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Grunt/Grunt.Gateway.Host/Dockerfile
          tags: halo-gateway:e2e
          outputs: type=docker,dest=${{ runner.temp }}/halo-gateway.tar
          cache-from: type=gha,scope=gateway-amd64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-image
          path: ${{ runner.temp }}/halo-gateway.tar
          retention-days: 1

  # The dashboard against the gateway itself: it pushes to a real Prometheus, which also evaluates the chart's alerts,
  # Grafana loads the dashboard the chart renders, every panel's query runs through Grafana's query API and every alert
  # must evaluate cleanly, then the panels run in Grafana's own frontend, $sel interpolated by Grafana
  # (tests/dashboard-stack.sh); and a screenshot of the dashboard, as an artifact
  dashboard:
    needs: [test, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-image
          path: ${{ runner.temp }}
      - name: Dashboard through Grafana
        env:
          GATEWAY_IMAGE: halo-gateway:e2e
          SCREENSHOT: halo-gateway-dashboard.png
        run: |
          set -euo pipefail
          docker load -i "${{ runner.temp }}/halo-gateway.tar"
          "$CHART"/tests/dashboard-stack.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halo-gateway-dashboard
          path: halo-gateway-dashboard.png

  e2e:
    needs: [test, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        k3s: [v1.34.12-k3s1, v1.36.5-k3s1]
    name: e2e (${{ matrix.k3s }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-image
          path: ${{ runner.temp }}

      - name: Cluster
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/k3d https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64
          chmod +x /usr/local/bin/k3d
          k3d cluster create e2e --image "rancher/k3s:${{ matrix.k3s }}" --no-lb --k3s-arg '--disable=traefik@server:0' --wait --timeout 180s
          kubectl version
          docker load -i "${{ runner.temp }}/halo-gateway.tar"
          for attempt in 1 2 3; do
            k3d image import halo-gateway:e2e -c e2e || true
            if docker exec k3d-e2e-server-0 ctr -n k8s.io images ls -q | grep -qx docker.io/library/halo-gateway:e2e; then
              echo "The e2e image is in the cluster (import $attempt)."; break
            fi
            [ "$attempt" -lt 3 ] || { echo "::error::The e2e image isn't in the cluster after 3 imports"; exit 1; }
            sleep 5
          done

      - name: End-to-end
        env:
          GATEWAY_IMAGE: halo-gateway:e2e
        run: ${{ env.CHART }}/e2e/run.sh

  publish:
    needs: [test, e2e, dashboard]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IDENTITY: ^https://github\.com/${{ github.repository }}/\.github/workflows/helm-chart\.yml@refs/heads/main$
    # version and digest are set only when a version is ready for its release: published and signed by this run, or by
    # an earlier attempt of it (a re-run); the release job runs on them
    outputs:
      version: ${{ steps.publish.outputs.version || steps.existing.outputs.version }}
      digest: ${{ steps.publish.outputs.digest || steps.existing.outputs.digest }}
      image: ${{ steps.image.outputs.ref }}
      image-digest: ${{ steps.image.outputs.digest }}
      image-commit: ${{ steps.image.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      # The version is <x.y>.<run number>, so it exists only when an earlier attempt of this run pushed it: then it is
      # released as it is, with no change check and no image wait
      - name: Version
        id: version
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$TOKEN" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          echo "$TOKEN" | cosign login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          base=$(sed -n 's/^version: *//p' "$CHART/Chart.yaml")
          version="${base%.*}.${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if helm show chart "$CHART_REPO/halo-gateway" --version "$version" > /dev/null 2>&1; then
            echo "halo-gateway $version is already published (an earlier attempt of this run): releasing it as it is."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # A re-run: the chart that attempt pushed, signed by this workflow (signed now if that attempt stopped before it)
      - name: The published version
        id: existing
        if: steps.version.outputs.published == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p pulled
          helm pull "$CHART_REPO/halo-gateway" --version "$VERSION" -d pulled 2>&1 | tee pull.txt
          digest=$(sed -n 's/^Digest: *//p' pull.txt)
          test -n "$digest"
          ref="${CHART_REPO#oci://}/halo-gateway@$digest"
          verify() { cosign verify "$ref" --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null; }
          if ! verify; then
            echo "halo-gateway $VERSION has no valid signature from this workflow: signing $digest."
            cosign sign --yes "$ref"
            verify
          fi
          helm show values "pulled/halo-gateway-$VERSION.tgz" > baked.yaml
          { echo "version=$VERSION"; echo "digest=$digest"
            echo "image-tag=$(yq -r '.image.tag' baked.yaml)"; echo "image-digest=$(yq -r '.image.digest' baked.yaml)"; } >> "$GITHUB_OUTPUT"

      # Whether to publish: anything in the chart or the gateway since the last release (so a replaced pending run's
      # changes still publish), and which image (this push's own when it changed the gateway, else the main image)
      - name: Did the chart or the gateway change?
        id: plan
        if: steps.version.outputs.published != 'true'
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          set -euo pipefail
          node .github/scripts/chart-release-notes.mjs --plan --chart "$CHART" --name halo-gateway --before "$BEFORE" | tee -a "$GITHUB_OUTPUT"

      # The image the chart runs, signed by gateway-image.yml on main, by digest, with its commit from its revision label:
      # - push: this push changed the gateway, so gateway-image.yml builds it as sha-<this commit>. Waits for it to be
      #   pushed and signed, unless a newer push changes the gateway (its chart run then publishes the newer image).
      # - main: the image gateway-image.yml last published, tagged main.
      # - a re-run: the image baked into the published version.
      - name: The gateway image
        id: image
        if: steps.version.outputs.published == 'true' || steps.plan.outputs.publish == 'true'
        env:
          SOURCE: ${{ steps.version.outputs.published == 'true' && 'baked' || steps.plan.outputs.image }}
          BAKED_TAG: ${{ steps.existing.outputs.image-tag }}
          BAKED_DIGEST: ${{ steps.existing.outputs.image-digest }}
        run: |
          set -euo pipefail
          signed() { cosign verify "$IMAGE@$1" --certificate-identity-regexp "$IMAGE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null 2>&1; }
          resolve() { docker buildx imagetools inspect "$IMAGE:$1" --format '{{.Manifest.Digest}}' 2>/dev/null; }
          case "$SOURCE" in
            push)
              tag="sha-${GITHUB_SHA:0:7}"
              for attempt in $(seq 1 80); do
                if digest=$(resolve "$tag") && [ -n "$digest" ] && signed "$digest"; then break; fi
                digest=
                git fetch -q origin main
                newer=$(git rev-parse FETCH_HEAD)
                if [ "$newer" != "$GITHUB_SHA" ] && [ "$(node .github/scripts/chart-release-notes.mjs --superseded --since "$GITHUB_SHA" --newer "$newer")" = true ]; then
                  echo "::notice::main is at $newer, which changes the gateway again: its run publishes the chart with that image. Not publishing."
                  exit 0
                fi
                echo "Waiting for gateway-image.yml to push and sign $IMAGE:$tag ($attempt/80)"
                sleep 30
              done
              [ -n "$digest" ] || { echo "::error::$IMAGE:$tag was not pushed and signed within 40 minutes"; exit 1; } ;;
            main)
              digest=$(resolve main)
              if [ -z "$digest" ] || ! signed "$digest"; then
                echo "::error::$IMAGE:main ($digest) has no valid signature from gateway-image.yml"; exit 1
              fi ;;
            baked)
              tag="$BAKED_TAG"; digest="$BAKED_DIGEST"
              if [ -z "$digest" ] || ! signed "$digest"; then
                echo "::error::The baked image $IMAGE@$digest has no valid signature from gateway-image.yml"; exit 1
              fi ;;
            *) echo "::error::Unknown image source $SOURCE"; exit 1 ;;
          esac
          commit=$(docker buildx imagetools inspect "$IMAGE@$digest" --format '{{index (index .Image "linux/amd64").Config.Labels "org.opencontainers.image.revision"}}')
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$IMAGE@$digest has no commit in its revision label"; exit 1; }
          case "$SOURCE" in
            push) [ "$commit" = "$GITHUB_SHA" ] || { echo "::error::$IMAGE:$tag was built from $commit, not $GITHUB_SHA"; exit 1; } ;;
            main)
              tag="sha-${commit:0:7}"
              mapfile -t paths < <(node .github/scripts/chart-release-notes.mjs --print-image-paths)
              if ! git cat-file -e "$commit^{commit}" 2>/dev/null || ! git diff --quiet "$commit" HEAD -- "${paths[@]}"; then
                echo "::warning::$IMAGE:main is built from $commit, and the gateway has changed since: the chart runs that image until gateway-image.yml publishes a newer one."
              fi ;;
            *) ;; # baked: the published version's own image, as it is
          esac
          { echo "ref=$IMAGE:$tag"; echo "tag=$tag"; echo "digest=$digest"; echo "commit=$commit"; } >> "$GITHUB_OUTPUT"
          echo "The chart runs $IMAGE:$tag ($digest), built from $commit."

      - name: Publish and sign
        id: publish
        if: steps.version.outputs.published != 'true' && steps.image.outputs.digest != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          # The image, baked in: the chart runs repository@digest, and the tag is its version label
          sed -i -E "/^image:/,/^[^ #]/{s/^  tag: .*/  tag: \"$IMAGE_TAG\"/;s/^  digest: .*/  digest: \"$IMAGE_DIGEST\"/}" "$CHART/values.yaml"
          sed -i -E "s/^appVersion: .*/appVersion: \"$IMAGE_TAG\"/" "$CHART/Chart.yaml"
          grep -qx "  digest: \"$IMAGE_DIGEST\"" "$CHART/values.yaml"
          helm package "$CHART" --version "$VERSION" -d dist
          helm push "dist/halo-gateway-$VERSION.tgz" "$CHART_REPO" 2>&1 | tee push.txt
          digest=$(sed -n 's/^Digest: *//p' push.txt)
          test -n "$digest"
          ref="${CHART_REPO#oci://}/halo-gateway@$digest"
          cosign sign --yes "$ref"
          cosign verify "$ref" --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          { echo "version=$VERSION"; echo "digest=$digest"; } >> "$GITHUB_OUTPUT"
          {
            echo "Published and signed $CHART_REPO/halo-gateway:$VERSION ($digest)."
            echo
            echo "Verify: cosign verify ${ref%@*}:$VERSION --certificate-identity-regexp '$IDENTITY' --certificate-oidc-issuer https://token.actions.githubusercontent.com"
          } >> "$GITHUB_STEP_SUMMARY"

  # A GitHub release for the version publish pushed, so Renovate shows release notes on chart bumps: Renovate matches a
  # release whose tag is <chart>-<version> for an OCI chart (ghcr.io/playgrifball/charts/halo-gateway -> halo-gateway),
  # see getExactReleaseMatch in renovatebot/renovate lib/workers/repository/update/pr/changelog/release-notes.ts. Never
  # marked the repository's latest release (left to other releases); not a v* tag, so publish.yml doesn't run on it. On a
  # re-run it updates the release's notes, and fails if the tag points at another commit.
  release:
    needs: [publish, packages]
    if: needs.publish.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          IMAGE_REF: ${{ needs.publish.outputs.image }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image-digest }}
          IMAGE_COMMIT: ${{ needs.publish.outputs.image-commit }}
          NUGET_PUBLISHED: ${{ needs.packages.outputs.nuget }}
          TYPESCRIPT_PUBLISHED: ${{ needs.packages.outputs.typescript }}
          IDENTITY: ^https://github\.com/${{ github.repository }}/\.github/workflows/helm-chart\.yml@refs/heads/main$
        run: |
          set -euo pipefail
          tag="halo-gateway-$VERSION"
          git fetch --tags --force origin
          package_flags=()
          [ "$NUGET_PUBLISHED" = true ] && package_flags+=(--nuget)
          [ "$TYPESCRIPT_PUBLISHED" = true ] && package_flags+=(--typescript)
          node .github/scripts/chart-release-notes.mjs --chart "$CHART" --name halo-gateway --version "$VERSION" \
            --repository "$GITHUB_REPOSITORY" --chart-repo "$CHART_REPO" --digest "$DIGEST" --identity "$IDENTITY" \
            --image "$IMAGE_REF" --image-digest "$IMAGE_DIGEST" --image-commit "$IMAGE_COMMIT" --image-identity "$IMAGE_IDENTITY" \
            "${package_flags[@]}" > notes.md
          if at=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
            test "$at" = "$GITHUB_SHA" || { echo "::error::$tag already points at $at, not $GITHUB_SHA"; exit 1; }
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "halo-gateway $VERSION" --notes-file notes.md --latest=false
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "halo-gateway $VERSION" --notes-file notes.md --latest=false
          fi
          echo "Released $tag: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"

  # The release version is also the client package version. Each registry is an independent, idempotent job, so all
  # destinations are attempted and "Re-run failed jobs" retries only failed destinations. The release is created after
  # these jobs, letting its notes list exactly which client package families this version published.
  packages:
    needs: publish
    if: needs.publish.outputs.version != ''
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.publish.outputs.version }}
      only_if_changed: true
    secrets: inherit

  # One deployment lane, unlike GrifballWebApp's test/staging/prod promotions. The synthetic commit keeps the chart
  # source and this release's exact image digest together; homelab's Argo CD Application follows deploy/current.
  deploy:
    needs: [publish, release, packages]
    if: needs.publish.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Move deploy/current
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          .github/scripts/gateway-deploy.sh "$GITHUB_SHA"
          "${{ needs.publish.outputs.image }}"
          "${{ needs.publish.outputs.image-digest }}"
          "${{ needs.publish.outputs.version }}"
