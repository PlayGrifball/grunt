name: Helm chart

# charts/halo-gateway: lint, helm-unittest, kubeconform (oldest/newest Kubernetes), an end-to-end install on k3d
# (charts/halo-gateway/e2e/run.sh, NetworkPolicies enforced) with the image built from this checkout, and, on main,
# publishing the chart signed (cosign keyless) to oci://ghcr.io/playgrifball/charts as halo-gateway:<x.y>.<run number>.

on:
  pull_request:
    branches: [main]
    paths: ["charts/**", "Grunt/**", ".github/workflows/helm-chart.yml"]
  push:
    branches: [main]
    paths: ["charts/**", "Grunt/**", ".github/workflows/helm-chart.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-chart-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CHART: charts/halo-gateway
  REGISTRY: ghcr.io
  CHART_REPO: oci://ghcr.io/playgrifball/charts
  KUBERNETES_OLDEST: "1.30.0"
  KUBERNETES_NEWEST: "1.34.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint
        run: |
          set -euo pipefail
          for values in "$CHART"/ci/*-values.yaml; do
            echo "::group::helm lint -f $values"
            helm lint "$CHART" --strict -f "$values"
            echo "::endgroup::"
          done

      - name: Unit tests
        run: |
          set -euo pipefail
          if helm version --short | grep -q '^v3'; then verify=; else verify=--verify=false; fi
          helm plugin install https://github.com/helm-unittest/helm-unittest $verify
          helm unittest "$CHART"

      - name: Schema check
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for k8s in "$KUBERNETES_OLDEST" "$KUBERNETES_NEWEST"; do
            for values in "$CHART"/ci/*-values.yaml; do
              echo "::group::$values, Kubernetes $k8s"
              helm template ci "$CHART" -n halo-gateway -f "$values" --kube-version "$k8s" \
                | ./kubeconform -strict -summary -kubernetes-version "$k8s" \
                    -schema-location default \
                    -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
              echo "::endgroup::"
            done
          done

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Gateway image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Grunt/Grunt.Gateway.Host/Dockerfile
          tags: halo-gateway:e2e
          outputs: type=docker,dest=${{ runner.temp }}/halo-gateway.tar
          cache-from: type=gha,scope=gateway-amd64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-image
          path: ${{ runner.temp }}/halo-gateway.tar
          retention-days: 1

  e2e:
    needs: [test, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        k3s: [v1.34.12-k3s1, v1.36.5-k3s1]
    name: e2e (${{ matrix.k3s }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-image
          path: ${{ runner.temp }}

      - name: Cluster
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/k3d https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64
          chmod +x /usr/local/bin/k3d
          k3d cluster create e2e --image "rancher/k3s:${{ matrix.k3s }}" --no-lb --k3s-arg '--disable=traefik@server:0' --wait --timeout 180s
          kubectl version
          docker load -i "${{ runner.temp }}/halo-gateway.tar"
          for attempt in 1 2 3; do
            k3d image import halo-gateway:e2e -c e2e || true
            if docker exec k3d-e2e-server-0 ctr -n k8s.io images ls -q | grep -qx docker.io/library/halo-gateway:e2e; then
              echo "The e2e image is in the cluster (import $attempt)."; break
            fi
            [ "$attempt" -lt 3 ] || { echo "::error::The e2e image isn't in the cluster after 3 imports"; exit 1; }
            sleep 5
          done

      - name: End-to-end
        env:
          GATEWAY_IMAGE: halo-gateway:e2e
        run: ${{ env.CHART }}/e2e/run.sh

  publish:
    needs: [test, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Did the chart change?
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             && git diff --quiet "$BEFORE" HEAD -- "$CHART"; then
            echo "The chart didn't change: nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: steps.changed.outputs.publish == 'true'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.changed.outputs.publish == 'true'
        with:
          cosign-release: v3.1.4

      - name: Publish and sign
        if: steps.changed.outputs.publish == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IDENTITY: ^https://github\.com/${{ github.repository }}/\.github/workflows/helm-chart\.yml@refs/heads/main$
        run: |
          set -euo pipefail
          echo "$TOKEN" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          echo "$TOKEN" | cosign login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          base=$(sed -n 's/^version: *//p' "$CHART/Chart.yaml")
          version="${base%.*}.${{ github.run_number }}"
          if helm show chart "$CHART_REPO/halo-gateway" --version "$version" >/dev/null 2>&1; then
            echo "halo-gateway $version is already published; not overwriting it."
            exit 0
          fi
          helm package "$CHART" --version "$version" -d dist
          helm push "dist/halo-gateway-$version.tgz" "$CHART_REPO" 2>&1 | tee push.txt
          digest=$(sed -n 's/^Digest: *//p' push.txt)
          test -n "$digest"
          ref="${CHART_REPO#oci://}/halo-gateway@$digest"
          cosign sign --yes "$ref"
          cosign verify "$ref" --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          {
            echo "Published and signed $CHART_REPO/halo-gateway:$version ($digest)."
            echo
            echo "Verify: cosign verify ${ref%@*}:$version --certificate-identity-regexp '$IDENTITY' --certificate-oidc-issuer https://token.actions.githubusercontent.com"
          } >> "$GITHUB_STEP_SUMMARY"
